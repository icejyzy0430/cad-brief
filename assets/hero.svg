<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">cad-brief workflow</title>
  <desc id="desc">Vague CAD input becomes an evidence-backed requirements package ready to hand to Text-to-CAD.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="12" x2="1130" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111C38"/>
      <stop offset="0.52" stop-color="#0B1428"/>
      <stop offset="1" stop-color="#080E1C"/>
    </linearGradient>
    <linearGradient id="accent" x1="470" y1="180" x2="730" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="492" y1="197" x2="708" y2="364" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102A44"/>
      <stop offset="1" stop-color="#19163A"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#60A5FA"/>
    </marker>
  </defs>

  <rect width="1200" height="480" rx="30" fill="url(#background)"/>
  <rect width="1200" height="480" rx="30" fill="url(#grid)"/>
  <circle cx="1060" cy="38" r="190" fill="#7C3AED" fill-opacity="0.08"/>
  <circle cx="128" cy="455" r="170" fill="#06B6D4" fill-opacity="0.08"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="70" y="42" width="172" height="30" rx="15" fill="#1E3A5F" stroke="#38BDF8" stroke-opacity="0.48"/>
    <text x="156" y="62" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.4">CAD INTENT COMPILER</text>
    <text x="70" y="116" fill="#F8FAFC" font-size="34" font-weight="760">把模糊想法变成可交接的 CAD 需求</text>
    <text x="70" y="150" fill="#94A3B8" font-size="17">最多两轮问询 · 主动研究 · 证据分级 · TTC-compatible handoff</text>

    <g filter="url(#shadow)">
      <rect x="70" y="205" width="270" height="150" rx="22" fill="#101A2D" stroke="#334155"/>
      <circle cx="112" cy="246" r="21" fill="#172554"/>
      <path d="M100 239h24v15h-12l-7 6v-6h-5z" fill="none" stroke="#60A5FA" stroke-width="2.6" stroke-linejoin="round"/>
      <text x="145" y="246" fill="#E2E8F0" font-size="20" font-weight="720">模糊输入</text>
      <text x="96" y="289" fill="#94A3B8" font-size="16">一句描述 · 参考图片 · 技术图纸</text>
      <rect x="96" y="313" width="190" height="24" rx="12" fill="#172033"/>
      <text x="191" y="330" fill="#CBD5E1" font-size="12.5" text-anchor="middle">型号未知 / 尺寸不全 / 目标宽泛</text>
    </g>

    <path d="M360 280h82" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="401" cy="280" r="15" fill="#102A44" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="401" y="285" fill="#7DD3FC" font-size="14" font-weight="700" text-anchor="middle">1</text>

    <g filter="url(#shadow)">
      <rect x="468" y="183" width="264" height="194" rx="24" fill="url(#accent)"/>
      <rect x="471" y="186" width="258" height="188" rx="21" fill="url(#cardGlow)"/>
      <rect x="496" y="210" width="44" height="44" rx="12" fill="#E0F2FE"/>
      <path d="m508 227 10-6 10 6-10 6zM508 227v11l10 6 10-6v-11" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="556" y="239" fill="#F8FAFC" font-size="24" font-weight="780">cad-brief</text>
      <text x="496" y="281" fill="#A5B4FC" font-size="14.5" font-weight="650">RESEARCH → REQUIREMENTS</text>
      <text x="496" y="310" fill="#CBD5E1" font-size="14">整理参数、接口、假设、冲突与验收</text>

      <rect x="496" y="331" width="68" height="25" rx="12.5" fill="#083344" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="530" y="348" fill="#67E8F9" font-size="12" font-weight="700" text-anchor="middle">≤ 2 轮</text>
      <rect x="571" y="331" width="76" height="25" rx="12.5" fill="#172554" stroke="#60A5FA" stroke-opacity="0.5"/>
      <text x="609" y="348" fill="#93C5FD" font-size="12" font-weight="700" text-anchor="middle">9 种证据</text>
      <rect x="654" y="331" width="52" height="25" rx="12.5" fill="#2E1065" stroke="#A78BFA" stroke-opacity="0.55"/>
      <text x="680" y="348" fill="#C4B5FD" font-size="12" font-weight="700" text-anchor="middle">3 状态</text>
    </g>

    <path d="M758 280h82" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="799" cy="280" r="15" fill="#102A44" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="799" y="285" fill="#7DD3FC" font-size="14" font-weight="700" text-anchor="middle">2</text>

    <g filter="url(#shadow)">
      <rect x="866" y="205" width="264" height="150" rx="22" fill="#101A2D" stroke="#334155"/>
      <circle cx="908" cy="246" r="21" fill="#052E2B"/>
      <path d="M898 235h17l7 7v16h-24zM915 235v7h7" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="m903 249 4 4 8-9" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="941" y="246" fill="#E2E8F0" font-size="20" font-weight="720">CAD 需求包</text>
      <text x="892" y="289" fill="#94A3B8" font-size="15.5">来源 · REQ-ID · 验收方法 · 限制</text>
      <rect x="892" y="313" width="212" height="24" rx="12" fill="#052E2B"/>
      <text x="998" y="330" fill="#6EE7B7" font-size="12.5" font-weight="650" text-anchor="middle">.cad-requirements.md + $cad prompt</text>
    </g>

    <g transform="translate(350 414)">
      <rect width="134" height="30" rx="15" fill="#052E2B" stroke="#22C55E" stroke-opacity="0.55"/>
      <circle cx="20" cy="15" r="5" fill="#22C55E"/>
      <text x="73" y="20" fill="#86EFAC" font-size="13" font-weight="700" text-anchor="middle">ready</text>
    </g>
    <g transform="translate(533 414)">
      <rect width="134" height="30" rx="15" fill="#422006" stroke="#F59E0B" stroke-opacity="0.6"/>
      <circle cx="20" cy="15" r="5" fill="#F59E0B"/>
      <text x="75" y="20" fill="#FCD34D" font-size="13" font-weight="700" text-anchor="middle">provisional</text>
    </g>
    <g transform="translate(716 414)">
      <rect width="134" height="30" rx="15" fill="#450A0A" stroke="#EF4444" stroke-opacity="0.58"/>
      <circle cx="20" cy="15" r="5" fill="#EF4444"/>
      <text x="73" y="20" fill="#FCA5A5" font-size="13" font-weight="700" text-anchor="middle">blocked</text>
    </g>
  </g>
</svg>
